<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário - Vithor Silva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="js/scripts.js" defer></script>
</head>
<body>
    <header>
        <h1>Vithor Silva (Vith)</h1>
        <nav aria-label="Navegação principal">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="graficos.html">Gráficos</a></li>
                <li><a href="multimidia.html">Mídias</a></li>
                <li><a href="formulario.html">Formulário</a></li>
                <li><a href="curriculo.html">Currículo</a></li>
            </ul>
        </nav>
    </header>

    <main class="container my-4">
        <section class="mb-4">
            <article>
                <h2>Entre em Contato!</h2>
                <div id="feedbackFormulario" class="feedback-box" role="status" aria-live="polite"></div>

                <form id="formContato" novalidate class="d-flex flex-column gap-3 mt-3">
                    <fieldset class="border rounded p-3 d-flex flex-column gap-2">
                        <legend class="float-none w-auto px-2 fw-bold fs-6" style="color: var(--primary-dark);">Dados Pessoais</legend>
                        
                        <label for="nome" class="form-label mb-0">Nome Completo:</label>
                        <input type="text" id="nome" name="nome" class="form-control" required placeholder="Digite seu nome">

                        <label for="email" class="form-label mb-0">E-mail:</label>
                        <input type="email" id="email" name="email" class="form-control" required placeholder="exemplo@email.com">

                        <label for="tel" class="form-label mb-0">Telefone (Formato: 11 99999-9999):</label>
                        <input type="tel" id="tel" name="tel" class="form-control" placeholder="11 99999-9999">

                        <label for="nasc" class="form-label mb-0">Data de Nascimento:</label>
                        <input type="date" id="nasc" name="nasc" class="form-control">
                    </fieldset>

                    <fieldset class="border rounded p-3 d-flex flex-column gap-2">
                        <legend class="float-none w-auto px-2 fw-bold fs-6" style="color: var(--primary-dark);">Preferências e Mensagem</legend>

                        <label for="cor" class="form-label mb-0">Escolha uma cor de destaque:</label>
                        <input type="color" id="cor" name="cor" class="form-control form-control-color" value="#0284c7" title="Escolha uma cor de destaque">

                        <label for="mensagem" class="form-label mb-0">Mensagem:</label>
                        <textarea id="mensagem" name="mensagem" class="form-control" rows="4" placeholder="Escreva sua mensagem..."></textarea>
                    </fieldset>

                    <button type="submit" class="btn btn-primary fw-bold py-2" style="background-color: var(--primary-color); border-color: var(--primary-color);">Enviar Formulário</button>
                </form>
            </article>
        </section>

        <section class="mb-4">
            <article>
                <h2>Mensagens Salvas</h2>
                <div id="historicoMensagens"></div>
            </article>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Vithor Silva - CP4, Universidade Braz Cubas.</p>
    </footer>
</body>
</html>
