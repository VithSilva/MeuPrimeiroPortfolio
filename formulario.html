<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário - Vithor Silva</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/scripts.js" defer></script>
</head>
<body>
    <header>
        <h1>Vithor Silva (Vith)</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="graficos.html">Gráficos</a></li>
                <li><a href="multimidia.html">Mídias</a></li>
                <li><a href="formulario.html">Formulário</a></li>
                <li><a href="curriculo.html">Currículo</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <article>
                <h2>Entre em Contato!</h2>
                <div id="feedbackFormulario" class="feedback-box"></div>

                <form id="formContato" novalidate style="display: flex; flex-direction: column; gap: 1.2rem; margin-top: 1rem;">
                    <fieldset style="border: 1px solid var(--border-color); border-radius: 8px; padding: 1.2rem; display: flex; flex-direction: column; gap: 0.8rem;">
                        <legend style="color: var(--primary-dark); font-weight: bold; padding: 0 0.5rem;">Dados Pessoais</legend>
                        
                        <label for="nome">Nome Completo:</label>
                        <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">

                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required placeholder="exemplo@email.com">

                        <label for="tel">Telefone (Formato: 11 99999-9999):</label>
                        <input type="tel" id="tel" name="tel" placeholder="11 99999-9999">

                        <label for="nasc">Data de Nascimento:</label>
                        <input type="date" id="nasc" name="nasc">
                    </fieldset>

                    <fieldset style="border: 1px solid var(--border-color); border-radius: 8px; padding: 1.2rem; display: flex; flex-direction: column; gap: 0.8rem;">
                        <legend style="color: var(--primary-dark); font-weight: bold; padding: 0 0.5rem;">Preferências e Mensagem</legend>

                        <label for="cor">Escolha uma cor de destaque:</label>
                        <input type="color" id="cor" name="cor" value="#0284c7">

                        <label for="mensagem">Mensagem:</label>
                        <textarea id="mensagem" name="mensagem" rows="4" placeholder="Escreva sua mensagem..."></textarea>
                    </fieldset>

                    <button type="submit" style="background-color: var(--primary-color); color: white; border: none; padding: 0.8rem; border-radius: 6px; font-weight: bold; cursor: pointer;">Enviar Formulário</button>
                </form>
            </article>
        </section>

        <section>
            <article>
                <h2>Mensagens Salvas</h2>
                <div id="historicoMensagens"></div>
            </article>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Vithor Silva - CP3, Universidade Braz Cubas.</p>
    </footer>
</body>
</html>
