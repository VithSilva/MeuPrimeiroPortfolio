    <main class="container my-4">
        <div class="row g-4">
            <section class="col-md-6">
                <article class="text-center h-100">
                    <h2>Gráfico SVG</h2>
                    <svg width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Ilustração vetorial SVG de uma estrela de quatro pontas azul dentro de um círculo" class="mt-3">
                        <circle cx="100" cy="100" r="80" fill="#e0f2fe" stroke="#0284c7" stroke-width="4" />
                        <polygon points="100,30 115,85 170,100 115,115 100,170 85,115 30,100 85,85" fill="#38bdf8" stroke="#0c4a6e" stroke-width="2" />
                        <circle cx="100" cy="100" r="12" fill="#ffffff" stroke="#0c4a6e" stroke-width="2" />
                    </svg>
                </article>
            </section>

            <section class="col-md-6">
                <article class="text-center h-100">
                    <h2>Elemento Canvas</h2>
                    <canvas id="meuCanvas" width="300" height="180" aria-label="Gráfico interativo renderizado em Canvas via JavaScript" style="border: 2px solid #38bdf8; border-radius: 8px; margin-top: 1rem; background-color: #ffffff;">
                        Gráfico geométrico desenhado via JavaScript Canvas.
                    </canvas>
                </article>
            </section>
        </div>
